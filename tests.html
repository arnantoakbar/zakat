<main id="main" tabindex="-1">
  <section class="fl-section">
    <div class="fl-wrap fl-wrap--narrow">
      <h1 class="zk-title">Uji mesin zakat</h1>
      <p class="zk-ket">Jawaban bakunya dari nash dan tabel kitab fiqh. Kalau ada satu saja yang gagal, hasil kalkulator tidak boleh dipercaya. Yang gagal tampil paling atas.</p>
      <p class="zk-ringkas-uji" id="ringkas" role="status">Menjalankan…</p>
      <ul class="fl-list zk-baris" id="daftar"></ul>
    </div>
  </section>

<script src="js/motion.min.js"></script>

<script src="js/zakat/uang.js?v=2"></script>

<script src="js/zakat/tani.js?v=2"></script>
<script src="js/zakat/ternak.js?v=2"></script>
<script src="js/zakat/rikaz.js?v=2"></script>
<script src="js/zakat/fitrah.js?v=2"></script>
<script src="js/zakat/solve.js?v=2"></script>
<script src="js/dalil.js?v=2"></script>
<script src="js/tests.js?v=2"></script>
<script>
(function () {
  var hasil = Tests.jalankan();
  var gagal = hasil.filter(function (h) { return !h.lulus; });
  var r = document.getElementById('ringkas');
  r.textContent = (hasil.length - gagal.length) + ' dari ' + hasil.length + ' lulus' +
    (gagal.length ? ', ' + gagal.length + ' gagal' : ', semuanya');
  r.dataset.ok = gagal.length ? '0' : '1';
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  document.getElementById('daftar').innerHTML = gagal.concat(hasil.filter(function (h) { return h.lulus; })).map(function (h) {
    return '<li><span class="fl-pf"' + (h.lulus ? '' : ' data-state="fail"') + '>' + (h.lulus ? 'Lulus' : 'Gagal') + '</span>' +
      '<div><b>' + esc(h.nama) + '</b>' + (h.pesan ? '<small>' + esc(h.pesan) + '</small>' : '') + '</div></li>';
  }).join('');
})();
</script>
<script src="js/ui-nav.js?v=2"></script>
